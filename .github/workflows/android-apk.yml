name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check project files
        run: python3 tests/static_project_check.py

      - name: Import project with Godot
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/MiniDashInspired.apk
          test -s build/MiniDashInspired.apk
          file build/MiniDashInspired.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniDashInspired-Android-APK
          path: build/MiniDashInspired.apk
          if-no-files-found: error
          retention-days: 7